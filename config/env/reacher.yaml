# @package _global_

dataset:
  dataset_path: data/datasets/lewm-reacher.h5
  # Reacher has no bare `proprio` column.
  keys_to_load: [pixels, action, observation]
  keys_to_cache: [action, observation]

world:
  env_name: swm/ReacherDMControl-v0
  env_kwargs:
    # The stock reacher tasks never terminate, so success would always read 0.
    task: qpos_match

evaluation:
  # World skips a callable whose method the env lacks, silently: a typo here reads as 0% success.
  state_callables:
    - method: set_state
      args:
        qpos: {value: qpos}
        qvel: {value: qvel}
    - method: set_target_qpos
      args:
        target_qpos: {value: goal_qpos}
